packages:
  - apps/*
  - packages/*
  - templates/*
  - '!**/test/**'

# Benchmark projects intentionally validate same-day framework releases.
minimumReleaseAge: 0

overrides:
  '@achrinza/node-ipc': npm:node-ipc-compat@1.0.0
  postcss: 8.5.28

# This DCloud release requires estree-walker from CommonJS without declaring it.
# A scoped dependency extension prevents accidental resolution to the ESM-only v3.
packageExtensions:
  '@dcloudio/uni-mp-vite@3.0.0-5020620260917001':
    dependencies:
      estree-walker: 2.0.2

allowBuilds:
  '@dcloudio/hbuilderx-cli': false
  '@parcel/watcher': false
  '@swc/core': false
  '@tailwindcss/oxide': true
  '@tarojs/binding': false
  '@tarojs/cli': false
  core-js: false
  core-js-pure: false
  esbuild: true
  msgpackr-extract: false
  sharp: true
  vue-demi: false
  workerd: true

versioning:
  changelog:
    storage: repository
